[project]
name = "xspeeria"
version = "0.0.0"
description = "Xspeeria application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Stage 4 Milestone 4.1A persistence foundation (DECISION S4-3) ---
    # Lower bounds only, matching the convention above; uv.lock pins the exact
    # resolution that CI installs with `uv sync --locked`.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".claude",
    ".impeccable",
    ".backup-before-repair",
    "node_modules",
    "mobile",
    "admin",
    "packages",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
    "^\\.claude/",
    "^\\.impeccable/",
    "^\\.backup-before-repair/",
    "^node_modules/",
    "^mobile/",
    "^admin/",
    "^packages/",
]
# `scripts` is on the path so the repo-hygiene guard is strict-checked like app code.
mypy_path = "backend:scripts"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
pythonpath = ["backend"]
asyncio_mode = "strict"
markers = [
    "integration: requires a real PostgreSQL 16 database (never SQLite)",
]

[tool.bandit]
exclude_dirs = [
    ".claude",
    ".impeccable",
    ".backup-before-repair",
    "tests",
    "backend/tests",
    "node_modules",
    "mobile",
    "admin",
]
