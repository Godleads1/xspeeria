; Alembic configuration -- Stage 4 Milestone 4.1A (DECISION H-5: migrations live at repo root).
;
; There is deliberately NO `sqlalchemy.url` key here. The database URL is resolved at
; runtime by `migrations/env.py` from `Settings.database_url`, so the one place that
; knows how to read configuration keeps knowing it, and no connection string -- local,
; CI or otherwise -- is ever committed to this file.

[alembic]
script_location = migrations
prepend_sys_path = backend
path_separator = os

; Migration filenames are prefixed with a zero-padded, monotonically increasing number so
; the chain is readable in directory order. The revision identifiers themselves remain
; the authority; the prefix is for humans.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
